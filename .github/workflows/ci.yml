name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore Atelier.slnx

      - name: Build solution (Release)
        run: dotnet build Atelier.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/Atelier.Tests/Atelier.Tests.csproj --configuration Release --no-build --verbosity normal
